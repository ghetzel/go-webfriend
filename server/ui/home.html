---
layout: none
---
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Webfriend Home Page</title>

    <style>
        html,
        body {
            background: #002255;
            padding: 0;
            margin: 0;
        }

        h1 {
            color: #AEC3E2;
            text-align: center;
        }

        @keyframes move-twink-back {
            from {
                background-position: 0 0;
            }
            to {
                background-position: -10000px 5000px;
            }
        }

        .stars, .twinkling {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .stars {
            background: transparent url('assets/img/stars.png') repeat top center;
            z-index: 0;
        }

        .twinkling {
            background: transparent url('assets/img/twinkling.png') repeat top center;
            z-index: 1;
            /* animation: move-twink-back 200s linear infinite; */
        }

        #main {
            position: absolute;
            padding-top: 3em;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
            display: flex;
            align-content: center;
            justify-content: flex-start;
            flex-direction: column;
            z-index: 100;
        }

        .label {
            display: block;
            margin-bottom: 4em;
        }

        .logo {
            filter: drop-shadow(0px 0px 14px rgb(121, 164, 217, 0.9));
        }
    </style>
</head>

<body>
    <div class="stars"></div>
    <div class="twinkling"></div>

    <div id="main">
        <img class="label" src="assets/img/logo-text-darkbg.svg">
        <img class="logo" src="assets/img/webfriend-full.svg">
    </div>
</body>

</html>
